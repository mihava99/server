name: Build Linux RPM (Fedora)

on:
    push:
        # branches: [ "master" ]
    pull_request:
        branches: ["master"]

jobs:
    build:
        name: Build Fedora ${{ matrix.release }} ${{ matrix.arch }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - release: 44
                      arch: x86_64
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}
        container: fedora:${{ matrix.release }}
        defaults:
            run:
                shell: bash

        steps:
            # Before the checkout, so that it gets a real git checkout, which the RPM build needs
            - name: Install git
              run: dnf -y install git-core

            - uses: actions/checkout@v7

            # The same script is used to build on a local Fedora
            - name: Build the RPM packages
              run: ./tools/linux/rpm/build-rpm
              env:
                  CI: 1

            - uses: actions/upload-artifact@v7
              with:
                  name: casparcg-server-fedora-${{ matrix.release }}-${{ matrix.arch }}
                  path: dist/rpm/*.rpm

    # In a clean container, to see that the package finds every library it needs by itself.
    # The build container has all the development packages installed, which hides missing dependencies.
    install:
        name: Install Fedora ${{ matrix.release }} ${{ matrix.arch }}
        needs: build
        strategy:
            fail-fast: false
            matrix:
                include:
                    - release: 44
                      arch: x86_64
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}
        container: fedora:${{ matrix.release }}
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: casparcg-server-fedora-${{ matrix.release }}-${{ matrix.arch }}

            - name: Show what the package contains
              run: |
                  rpm --query --package --info ./casparcg-server-[0-9]*.${{ matrix.arch }}.rpm
                  rpm --query --package --requires ./casparcg-server-[0-9]*.${{ matrix.arch }}.rpm
                  rpm --query --package --list ./casparcg-server-[0-9]*.${{ matrix.arch }}.rpm

            - name: Install the package
              run: dnf -y install ./casparcg-server-[0-9]*.${{ matrix.arch }}.rpm

            - name: Check that every library is found
              run: |
                  ldd /usr/bin/casparcg-server | tee ldd.txt
                  ! grep 'not found' ldd.txt

            # The server loads libomt when OMT is used, and it needs ICU and libvmx to start
            - name: Check that libomt loads
              run: |
                  dnf -y install python3
                  python3 - <<'EOF'
                  import ctypes
                  libomt = ctypes.CDLL("/usr/lib64/casparcg-server/libomt.so")
                  for name in ("omt_discovery_getaddresses", "omt_receive_create", "omt_send_create", "omt_send"):
                      getattr(libomt, name)
                  EOF
